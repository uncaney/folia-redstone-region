name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts','gradle/wrapper/gradle-wrapper.properties','gradle.properties') }}
          restore-keys: gradle-

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :plugin:build :test-plugin:build

      - uses: actions/upload-artifact@v4
        with:
          name: folia-redstone-region
          path: plugin/build/libs/plugin-*-reobf.jar
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: folia-redstone-region-tests
          path: test-plugin/build/libs/test-plugin-*-reobf.jar
          if-no-files-found: error
          retention-days: 30
