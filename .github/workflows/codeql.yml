name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 7 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      - name: Build (manual mode for paperweight-userdev)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :plugin:compileJava :test-plugin:compileJava

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
