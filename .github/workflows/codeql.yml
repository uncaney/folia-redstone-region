name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 7 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      - name: Fetch Luminol compile-only jars
        run: |
          mkdir -p vendor
          curl -fsSL -o vendor/luminol-server-26.2.jar \
            https://forgejo.ekaii.fr/exo/luminol-ekaii/releases/download/v26.2-ekaii-0.2.0/luminol-server-26.2.jar
          curl -fsSL -o vendor/luminol-api-26.2.jar \
            https://forgejo.ekaii.fr/exo/luminol-ekaii/releases/download/v26.2-ekaii-0.2.0/luminol-api-26.2.jar

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :plugin:compileJava :test-plugin:compileJava

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
