# folia-redstone-region — per-chunk vanilla/AC dispatch on Folia 1.21.11.
# Tick-budget sensitive — was meant to use the redstone scenario as headline
# test, but agent/scenario/redstone.js depends on mineflayer which ECONNRESETs
# against Folia/Luminol 26.x (newer than mineflayer's protocol cap).
# Until redstone.js gets ported to RCON `/setblock` (no-bot), use chunkstorm
# (chunky+RCON, folia-supported) for load coverage instead.
[bench]
flavor          = "folia"
flavor_version  = "1.21.11-build-6"
scenarios       = ["idle", "chunkstorm"]
depth           = "L2"
repeats         = 2
warmup_min      = 2
duration_min    = 5

[bench.build]
# Build needs Luminol compile-only jars staged in vendor/.
prebuild = [
  "mkdir -p vendor",
  "curl -fsSL -o vendor/luminol-server-26.1.2.jar https://forgejo.ekaii.fr/exo/luminol-ekaii/releases/download/v26.1.2-ekaii-0.1.0/luminol-server-26.1.2.jar",
  "curl -fsSL -o vendor/luminol-api-26.1.2.jar    https://forgejo.ekaii.fr/exo/luminol-ekaii/releases/download/v26.1.2-ekaii-0.1.0/luminol-api-26.1.2.jar",
]
command       = "chmod +x gradlew && ./gradlew --no-daemon :plugin:build :test-plugin:build"
artifact_glob = "plugin/build/libs/*.jar"