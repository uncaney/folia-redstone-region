# plugbench gate (plugin) — drop-in workflow.
# Triggers on every push + PR (workflow_run isn't supported on this forgejo
# instance). Builds the jar inline, runs plugbench against it, sets a commit
# status — branch protection blocks merge when the bench fails.
#
# Customise via `.plugbench.toml`:
#
#     [bench]
#     flavor          = "luminol"           # paper | folia | luminol
#     flavor_version  = "26.1.2-ekaii"
#     scenarios       = ["idle", "chunkstorm"]
#     depth           = "L2"                # L0..L4
#     repeats         = 2
#     warmup_min      = 2
#     duration_min    = 5
#
#     [bench.deps]
#     plugins = ["mapacheelib"]             # extra jars from /fast/plugbench/jars/plugins/
#
#     [bench.build]                         # optional — only set when defaults don't work
#     prebuild = [
#       "mkdir -p vendor",
#       "curl -fsSL -o vendor/dep.jar https://...",
#     ]
#     command       = "./gradlew --no-daemon clean :plugin:build"
#     artifact_glob = "plugin/build/libs/*.jar"
name: plugbench
on:
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  bench:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
      volumes:
        # Without these, `docker run` and bind-writes from inside the job fail.
        # The runner's /data/config.yml whitelists both via `valid_volumes`.
        - /var/run/docker.sock:/var/run/docker.sock
        - /fast/plugbench:/fast/plugbench
    defaults:
      run:
        # forgejo-runner defaults to /bin/sh (dash); ${var//x/y} bash syntax
        # would otherwise hit "Bad substitution".
        shell: bash
    env:
      SHA: ${{ github.sha }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Init bench-host log dir
        # Ensure the log dir exists on the bench host so EVERY subsequent step can
        # tee its output there. Forgejo's task-log API is unreliable on this
        # instance, so we publish our own logs and inspect via SSH.
        # Note: paths inside the sibling busybox refer to /dst (the bind mount).
        run: |
          set -ex
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y --no-install-recommends docker.io curl jq python3
          fi
          docker run --rm -v /fast/plugbench:/dst -e DIR_REL="gate-logs/${PR_REPO//\//_}/${SHA}" busybox \
            sh -c "mkdir -p /dst/\$DIR_REL && chmod -R 0755 /dst/\$DIR_REL"

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # cache: '' disables the post-step gradle/maven cache hash which
          # was hanging in the EH job (long enough for act-runner to time out).
          # Each gate run starts fresh anyway.
          cache: ''

      - name: Build (prebuild + main + jar discovery)
        # Combined into one step so empty config strings don't leak through
        # $GITHUB_ENV mid-flight. Reads .plugbench.toml directly here. All
        # output streams to /tmp/build.log + a sibling-published gate-log.
        id: find
        run: |
          # Defensive: log start to runner stdout immediately so silent crashes
          # produce *some* signal in the task log.
          echo "[Build] step entered $(date -u +%H:%M:%S)"
          which python3 || { echo "[Build] FATAL: python3 missing"; exit 1; }
          set -uo pipefail
          PREBUILD="" ; BUILD_CMD="" ; ARTIFACT_GLOB=""
          if [ -f .plugbench.toml ]; then
            echo "[Build] reading .plugbench.toml"
            EVAL_OUT=$(python3 - <<'PYEOF' 2>&1 || echo "PY_ERROR")
          import tomllib
          from pathlib import Path
          b = (tomllib.loads(Path(".plugbench.toml").read_text()).get("bench", {}) or {}).get("build", {}) or {}
          def emit(k, v):
              if not v: return
              # Single-quote and escape any embedded single-quotes
              v = v.replace("'", "'\\''")
              print(f"{k}='{v}'")
          emit("PREBUILD", "\n".join(b.get("prebuild", [])))
          emit("BUILD_CMD", b.get("command", ""))
          emit("ARTIFACT_GLOB", b.get("artifact_glob", ""))
          PYEOF
            echo "[Build] python emitted $(printf %s "$EVAL_OUT" | wc -c) bytes"
            if echo "$EVAL_OUT" | grep -q PY_ERROR; then
              echo "[Build] python parse failed, ignoring [bench.build] from toml"
            else
              eval "$EVAL_OUT" || echo "[Build] eval failed, continuing with empty build vars"
            fi
          fi
          echo "[Build] PREBUILD=$(printf %s "$PREBUILD" | wc -c)B BUILD_CMD=$(printf %s "$BUILD_CMD" | wc -c)B ARTIFACT_GLOB=$ARTIFACT_GLOB"
          echo "[Build] entering inner block"
          set +u  # tolerate optional vars in inner block

          {
            set -ex
            if [ -n "$PREBUILD" ]; then
              echo "## PREBUILD"
              bash -ex -c "$PREBUILD"
            fi
            echo "## BUILD"
            if [ -n "$BUILD_CMD" ]; then
              bash -ex -c "$BUILD_CMD"
            elif [ -f gradlew ]; then
              chmod +x gradlew
              ./gradlew --no-daemon clean build
            elif [ -f pom.xml ]; then
              apt-get install -y --no-install-recommends maven
              mvn -B -DskipTests package
            else
              echo "no build system detected"; exit 1
            fi
            echo "## FIND JAR"
            if [ -n "$ARTIFACT_GLOB" ]; then
              JAR=$(ls -1 $ARTIFACT_GLOB 2>/dev/null | head -1)
            else
              # Look only in canonical output dirs (build/libs for gradle, target
              # for maven); pick the largest non-sources/javadoc/api jar.
              JAR=$(find . \
                      \( -path '*/build/libs/*.jar' -o -path '*/target/*.jar' \) \
                      -not -path './.git/*' \
                      -not -path '*/build/tmp/*' \
                      -not -path '*/buildSrc/*' \
                      -not -path '*/gradle/wrapper/*' \
                      -not -path '*/.gradle/*' \
                      -not -name '*-sources.jar' \
                      -not -name '*-javadoc.jar' \
                      -not -name 'gradle-wrapper.jar' \
                    | xargs -I{} sh -c 'echo "$(stat -c %s {} 2>/dev/null) {}"' \
                    | sort -rn | head -1 | awk '{print $2}')
            fi
            [ -z "$JAR" ] && { echo "no jar produced — ls build/libs:"; ls -la build/libs target 2>&1; exit 1; }
            echo "produced jar: $JAR ($(stat -c %s "$JAR") bytes)"
            echo "[Build] inner block end"
            echo "jar=$JAR" >> $GITHUB_OUTPUT
          } 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "[Build] block exited rc=$rc"
          cat /tmp/build.log | docker run --rm -i \
            -v /fast/plugbench:/dst -e P="${PR_REPO//\//_}/${SHA}" busybox \
            sh -c 'mkdir -p /dst/gate-logs/$P && cat > /dst/gate-logs/$P/build.log' || true
          exit $rc

      - name: Stage jar to bench host
        id: stage
        run: |
          set -ex
          JAR="${{ steps.find.outputs.jar }}"
          NAME="$(basename '${{ github.repository }}' | tr / -)"
          cat "$JAR" | docker run --rm -i \
            -v /fast/plugbench:/dst -e NAME="$NAME" busybox \
            sh -c 'mkdir -p /dst/jars/plugins && cat > /dst/jars/plugins/$NAME.jar && chmod 0644 /dst/jars/plugins/$NAME.jar'
          echo "jar_path=/fast/plugbench/jars/plugins/${NAME}.jar" >> $GITHUB_OUTPUT
          echo "jar_name=$NAME" >> $GITHUB_OUTPUT

      - name: Clone plugbench-ekaii
        run: git clone --depth=1 https://forgejo.ekaii.fr/exo/plugbench-ekaii.git /tmp/plugbench-ekaii

      - name: Run plugbench gate
        id: gate
        env:
          PLUGBENCH_KIND: plugin
          PLUGBENCH_JAR: ${{ steps.stage.outputs.jar_path }}
          PLUGBENCH_VERSION: ${{ env.SHA }}
          PLUGBENCH_REPO_DIR: ${{ github.workspace }}
          PLUGBENCH_REPO: /tmp/plugbench-ekaii
        run: |
          set -o pipefail
          bash /tmp/plugbench-ekaii/scripts/gate.sh | tee /tmp/gate-output.txt
          # Persist the resolved run_id from the gate output for downstream steps.
          RUN_ID=$(grep -oE '\[gate\] run_id=([0-9a-f-]+)' /tmp/gate-output.txt | tail -1 | awk -F= '{print $2}')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Stage report artifacts to runner workspace (so upload-artifact can grab them)
        if: always() && steps.gate.outputs.run_id != ''
        run: |
          set -ex
          mkdir -p ${{ github.workspace }}/_report
          # Pull the report bundle out of /fast/plugbench (which is bind-mounted into this container)
          cp -r /fast/plugbench/runs/${{ steps.gate.outputs.run_id }}/. ${{ github.workspace }}/_report/ || true
          ls -la ${{ github.workspace }}/_report/

      - name: Upload report bundle as workflow artifact (A)
        if: always() && steps.gate.outputs.run_id != ''
        uses: actions/upload-artifact@v3
        with:
          name: plugbench-${{ env.SHA }}
          path: |
            _report/report.md
            _report/report.html
            _report/report.json
            _report/manifest.json
            _report/**/events.parquet
          if-no-files-found: warn

      - name: Commit report to exo/plugbench-reports (B)
        if: always() && steps.gate.outputs.run_id != ''
        env:
          REPORTS_TOKEN: ${{ secrets.PLUGBENCH_REPORTS_TOKEN || secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          REPO_SLUG="${PR_REPO//\//_}"
          DEST="${REPO_SLUG}/${SHA}"
          git config --global user.email "plugbench@ekaii.fr"
          git config --global user.name  "plugbench-gate"
          git clone --depth=1 \
            "https://${REPORTS_TOKEN}@forgejo.ekaii.fr/exo/plugbench-reports.git" \
            /tmp/reports
          mkdir -p "/tmp/reports/${DEST}"
          for f in report.md report.html report.json manifest.json; do
            [ -f "${{ github.workspace }}/_report/$f" ] && cp "${{ github.workspace }}/_report/$f" "/tmp/reports/${DEST}/"
          done
          # Index page per repo
          INDEX="/tmp/reports/${REPO_SLUG}/README.md"
          {
            echo "# ${PR_REPO} — plugbench history"
            echo
            echo "| commit | run | status | report |"
            echo "| --- | --- | --- | --- |"
            for d in "/tmp/reports/${REPO_SLUG}/"*/; do
              [ -d "$d" ] || continue
              SHA_=$(basename "$d")
              [ "$SHA_" = "README.md" ] && continue
              # Pull status from report.json if present
              STATE=$(python3 -c "import json,sys; d=json.load(open('${d}report.json')); print(d.get('run',{}).get('status','?'))" 2>/dev/null || echo '?')
              echo "| \`${SHA_:0:8}\` | $(date -r "$d" -u +%Y-%m-%d) | $STATE | [report.md](./${SHA_}/report.md) |"
            done | sort -k4 -r
          } > "$INDEX"
          cd /tmp/reports
          git add -A
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "${PR_REPO} ${SHA:0:8} (status=${{ steps.gate.outcome }})"
            git push origin main
          fi

      - name: Set commit status
        if: always()
        run: |
          STATE=failure
          if [ "${{ steps.gate.outcome }}" = "success" ]; then STATE=success; fi
          REPO_SLUG="${PR_REPO//\//_}"
          REPORT_URL="${{ github.server_url }}/exo/plugbench-reports/src/branch/main/${REPO_SLUG}/${SHA}/report.md"
          curl -sS -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses/${SHA}" \
            -d "{\"state\":\"$STATE\",\"context\":\"plugbench/bench\",\"target_url\":\"${REPORT_URL}\",\"description\":\"plugbench gate $STATE\"}" \
            || true
