name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm

    steps:
      - name: Install JDK 21
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y --no-install-recommends curl ca-certificates
          # Adoptium Temurin 21
          curl -fsSL -o /tmp/jdk.tgz \
            https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.5_11.tar.gz
          if ! tar -tzf /tmp/jdk.tgz >/dev/null 2>&1; then
            arch=$(dpkg --print-architecture)
            case "$arch" in
              amd64) ARCH=x64 ;;
              arm64) ARCH=aarch64 ;;
              *)     ARCH=x64 ;;
            esac
            curl -fsSL -o /tmp/jdk.tgz \
              "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_${ARCH}_linux_hotspot_21.0.5_11.tar.gz"
          fi
          mkdir -p /opt/jdk21
          tar -xzf /tmp/jdk.tgz -C /opt/jdk21 --strip-components=1
          /opt/jdk21/bin/java -version
          echo "JAVA_HOME=/opt/jdk21" >> "$GITHUB_ENV"
          echo "/opt/jdk21/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts','gradle/wrapper/gradle-wrapper.properties','gradle.properties') }}
          restore-keys: gradle-

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :plugin:build :test-plugin:build

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: folia-redstone-region
          path: plugin/build/libs/plugin-*-reobf.jar

      - name: Upload test-plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: folia-redstone-region-tests
          path: test-plugin/build/libs/test-plugin-*-reobf.jar
