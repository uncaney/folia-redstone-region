name: folia-redstone-region-tests
version: '${version}'
main: net.ekaii.redstone.test.TestPluginMain
api-version: '1.21'
folia-supported: true
authors: [ekaii]
description: In-server parity and performance harness for folia-redstone-region.
dependencies:
  server:
    RedstoneRegions:
      load: BEFORE
      required: true
      join-classpath: true
permissions:
  redstone-region.demo:
    description: Allows /demo-map to build the demo redstone showcase
    default: op
